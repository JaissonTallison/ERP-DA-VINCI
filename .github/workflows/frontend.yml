name: frontend

on:
  pull_request:
    paths: &paths
      - apps/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .nvmrc
      - .npmrc
      - .prettierrc.json
      - .prettierignore
      - osv-scanner.toml
      - .github/workflows/frontend.yml
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, tipos, testes e build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  vulnerabilities:
    name: vulnerabilidades (pnpm-lock)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Exceções justificadas e com prazo em osv-scanner.toml.
      - run: >-
          docker run --rm -v "$PWD:/src:ro" ghcr.io/google/osv-scanner:v2.7.0
          scan source --config /src/osv-scanner.toml --lockfile /src/pnpm-lock.yaml
