name: backend

on:
  pull_request:
    paths: &paths
      - build-logic/**
      - libs/java/**
      - services/**
      - contracts/**
      - infra/local/keycloak/**
      - osv-scanner.toml
      - gradle/**
      - gradlew
      - gradlew.bat
      - settings.gradle.kts
      - gradle.properties
      - .github/workflows/backend.yml
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: formatação, compilação e testes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      # Valida o checksum do gradle-wrapper.jar e configura cache.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew build --no-daemon
      # O build gera o SBOM CycloneDX de cada serviço; a varredura cobre as dependências que vão para produção.
      - name: vulnerabilidades (SBOM dos serviços)
        run: |
          args=()
          for sbom in services/*/build/reports/cyclonedx/application.cdx.json; do args+=(-L "/src/$sbom"); done
          docker run --rm -v "$PWD:/src:ro" ghcr.io/google/osv-scanner:v2.7.0 \
            scan source --config /src/osv-scanner.toml "${args[@]}"
