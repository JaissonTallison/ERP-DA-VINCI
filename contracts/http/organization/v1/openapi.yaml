openapi: 3.1.0
info:
  title: Organization Management API
  version: 1.0.0
  description: |
    Estrutura corporativa do cliente: grupos econômicos, entidades jurídicas (etapa 2), estabelecimentos (etapa 3) e estrutura organizacional com vigência (etapa 4).
    O tenant vem sempre do token (claim `organization`); recurso de outro tenant responde 404.
    Modelo de domínio: docs/domains/organization/ORGANIZATION_DOMAIN_MODEL.md.
servers:
  - url: http://localhost:5632
    description: Ambiente local
security:
  - bearer: []
paths:
  /v1/economic-groups:
    post:
      operationId: createEconomicGroup
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/CreateEconomicGroupRequest' } },
          }
      responses:
        '201': { $ref: '#/components/responses/EconomicGroup' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listEconomicGroups
      parameters:
        - { name: status, in: query, schema: { enum: [ACTIVE, CLOSED] } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Página de grupos
          content:
            { application/json: { schema: { $ref: '#/components/schemas/EconomicGroupPage' } } }
  /v1/economic-groups/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: getEconomicGroup
      responses:
        '200': { $ref: '#/components/responses/EconomicGroup' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateEconomicGroup
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          {
            application/merge-patch+json:
              { schema: { $ref: '#/components/schemas/UpdateEconomicGroupRequest' } },
          }
      responses:
        '200': { $ref: '#/components/responses/EconomicGroup' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
  /v1/economic-groups/{id}/close:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: closeEconomicGroup
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LifecycleRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/EconomicGroup' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/economic-groups/{id}/legal-entities:
    parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/AsOf' }]
    get:
      operationId: listGroupLegalEntities
      responses:
        '200':
          description: Entidades do grupo na data
          content:
            { application/json: { schema: { $ref: '#/components/schemas/LegalEntityPage' } } }
  /v1/legal-entities:
    post:
      operationId: createLegalEntity
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          {
            application/json: { schema: { $ref: '#/components/schemas/CreateLegalEntityRequest' } },
          }
      responses:
        '201': { $ref: '#/components/responses/LegalEntity' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listLegalEntities
      parameters:
        - { name: country, in: query, schema: { type: string, pattern: '^[A-Z]{2}$' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/LegalEntityStatus' } }
        - { name: economicGroupId, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { $ref: '#/components/parameters/AsOf' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Página de entidades jurídicas
          content:
            { application/json: { schema: { $ref: '#/components/schemas/LegalEntityPage' } } }
  /v1/legal-entities/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/AsOf' }]
    get:
      operationId: getLegalEntity
      responses:
        '200': { $ref: '#/components/responses/LegalEntity' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateLegalEntity
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          {
            application/merge-patch+json:
              { schema: { $ref: '#/components/schemas/UpdateLegalEntityRequest' } },
          }
      responses:
        '200': { $ref: '#/components/responses/LegalEntity' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
  /v1/legal-entities/{id}/{transition}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - {
          name: transition,
          in: path,
          required: true,
          schema: { enum: [activate, suspend, reactivate, close] },
        }
    post:
      operationId: transitionLegalEntity
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LifecycleRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/LegalEntity' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/legal-entities/{id}/economic-group:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      operationId: assignEconomicGroup
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/GroupAssignmentRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/LegalEntity' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/legal-entities/{id}/tax-identifiers:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: addTaxIdentifier
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/TaxIdentifierRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/LegalEntity' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/legal-entities/{id}/tax-identifiers/{taxIdentifierId}/end:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: taxIdentifierId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: endTaxIdentifier
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LifecycleRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/LegalEntity' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/establishments:
    post:
      operationId: openEstablishment
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          {
            application/json: { schema: { $ref: '#/components/schemas/OpenEstablishmentRequest' } },
          }
      responses:
        '201': { $ref: '#/components/responses/Establishment' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listEstablishments
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/EstablishmentType' } }
        - { name: status, in: query, schema: { enum: [ACTIVE, SUSPENDED, CLOSED] } }
        - { name: country, in: query, schema: { $ref: '#/components/schemas/CountryCode' } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Página de estabelecimentos (ordem por código e id)
          content:
            { application/json: { schema: { $ref: '#/components/schemas/EstablishmentPage' } } }
  /v1/establishments/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: getEstablishment
      responses:
        '200': { $ref: '#/components/responses/Establishment' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateEstablishment
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          {
            application/merge-patch+json:
              { schema: { $ref: '#/components/schemas/UpdateEstablishmentRequest' } },
          }
      responses:
        '200': { $ref: '#/components/responses/Establishment' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
  /v1/establishments/{id}/{transition}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - {
          name: transition,
          in: path,
          required: true,
          schema: { enum: [suspend, reactivate, close] },
        }
    post:
      operationId: transitionEstablishment
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/LifecycleRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/Establishment' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/establishments/{id}/tax-identifiers:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: addEstablishmentTaxIdentifier
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/TaxIdentifierRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/Establishment' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/establishments/{id}/tax-identifiers/{taxIdentifierId}/end:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: taxIdentifierId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: endEstablishmentTaxIdentifier
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/LifecycleRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/Establishment' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/unit-types:
    post:
      operationId: createUnitType
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/CreateUnitTypeRequest' } } }
      responses:
        '201':
          {
            description: Tipo criado,
            content: { application/json: { schema: { $ref: '#/components/schemas/UnitType' } } },
          }
        '409': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listUnitTypes
      responses:
        '200':
          description: Tipos do tenant
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [items],
                      properties:
                        {
                          items: { type: array, items: { $ref: '#/components/schemas/UnitType' } },
                        },
                    },
                },
            }
  /v1/unit-types/{id}/nesting:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: getNesting
      responses:
        '200':
          {
            description: Tipos permitidos como pai (vazio = qualquer),
            content: { application/json: { schema: { $ref: '#/components/schemas/Nesting' } } },
          }
    put:
      operationId: setNesting
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [allowedParentTypeIds],
                    additionalProperties: false,
                    properties:
                      {
                        allowedParentTypeIds:
                          {
                            type: array,
                            maxItems: 100,
                            uniqueItems: true,
                            items: { type: string, format: uuid },
                          },
                      },
                  },
              },
          }
      responses:
        '200':
          {
            description: Regras gravadas,
            content: { application/json: { schema: { $ref: '#/components/schemas/Nesting' } } },
          }
  /v1/organizational-units:
    post:
      operationId: createUnit
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/CreateUnitRequest' } } }
      responses:
        '201': { $ref: '#/components/responses/Unit' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listUnits
      parameters:
        - { name: unitTypeId, in: query, schema: { type: string, format: uuid } }
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { enum: [ACTIVE, INACTIVE, CLOSED] } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          {
            description: Página de unidades,
            content: { application/json: { schema: { $ref: '#/components/schemas/UnitPage' } } },
          }
  /v1/organizational-units/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: getUnit
      responses:
        '200': { $ref: '#/components/responses/Unit' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateUnit
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          {
            application/merge-patch+json:
              { schema: { $ref: '#/components/schemas/UpdateUnitRequest' } },
          }
      responses:
        '200': { $ref: '#/components/responses/Unit' }
        '412': { $ref: '#/components/responses/Problem' }
  /v1/organizational-units/{id}/{transition}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - {
          name: transition,
          in: path,
          required: true,
          schema: { enum: [deactivate, reactivate, close] },
        }
    post:
      operationId: transitionUnit
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/LifecycleRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/Unit' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/structures:
    post:
      operationId: createStructure
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/CreateStructureRequest' } } }
      responses:
        '201':
          {
            description: Estrutura criada,
            content: { application/json: { schema: { $ref: '#/components/schemas/Structure' } } },
          }
        '409': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listStructures
      responses:
        '200':
          description: Estruturas do tenant
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [items],
                      properties:
                        {
                          items: { type: array, items: { $ref: '#/components/schemas/Structure' } },
                        },
                    },
                },
            }
  /v1/structures/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: getStructure
      responses:
        '200':
          {
            description: Estrutura,
            content: { application/json: { schema: { $ref: '#/components/schemas/Structure' } } },
          }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/structures/{id}/moves:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: moveUnit
      summary: Posiciona ou move a unidade a partir de effectiveOn (pai nulo = raiz). Datas futuras são aceitas.
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [unitId, effectiveOn],
                    additionalProperties: false,
                    properties:
                      {
                        unitId: { type: string, format: uuid },
                        parentUnitId: { type: [string, 'null'], format: uuid },
                        effectiveOn: { type: string, format: date },
                      },
                  },
              },
          }
      responses:
        '200': { $ref: '#/components/responses/Unit' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/structures/{id}/removals:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: removeUnit
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [unitId, effectiveOn],
                    additionalProperties: false,
                    properties:
                      {
                        unitId: { type: string, format: uuid },
                        effectiveOn: { type: string, format: date },
                      },
                  },
              },
          }
      responses:
        '200': { $ref: '#/components/responses/Unit' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/structures/{id}/roots:
    parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/AsOf' }]
    get:
      operationId: getRoots
      responses:
        '200': { $ref: '#/components/responses/Tree' }
  /v1/structures/{id}/units/{unitId}/children:
    parameters:
      [
        { $ref: '#/components/parameters/Id' },
        { $ref: '#/components/parameters/UnitId' },
        { $ref: '#/components/parameters/AsOf' },
      ]
    get:
      operationId: getChildren
      responses:
        '200': { $ref: '#/components/responses/Tree' }
  /v1/structures/{id}/units/{unitId}/subtree:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { $ref: '#/components/parameters/UnitId' }
      - { $ref: '#/components/parameters/AsOf' }
      - {
          name: maxDepth,
          in: query,
          schema: { type: integer, minimum: 0, maximum: 64, default: 64 },
        }
      - {
          name: limit,
          in: query,
          schema: { type: integer, minimum: 1, maximum: 50000, default: 10000 },
        }
    get:
      operationId: getSubtree
      responses:
        '200': { $ref: '#/components/responses/Tree' }
  /v1/structures/{id}/units/{unitId}/ancestors:
    parameters:
      [
        { $ref: '#/components/parameters/Id' },
        { $ref: '#/components/parameters/UnitId' },
        { $ref: '#/components/parameters/AsOf' },
      ]
    get:
      operationId: getAncestors
      responses:
        '200': { $ref: '#/components/responses/Tree' }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    AsOf:
      {
        name: asOf,
        in: query,
        schema: { type: string, format: date },
        description: 'Data de referência; padrão: hoje no fuso da entidade',
      }
    Limit:
      { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    UnitId: { name: unitId, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey:
      {
        name: Idempotency-Key,
        in: header,
        required: true,
        schema: { type: string, minLength: 1, maxLength: 100 },
      }
    IfMatch:
      {
        name: If-Match,
        in: header,
        required: true,
        schema: { type: string },
        description: 'Versão atual, como devolvida no ETag',
      }
  responses:
    EconomicGroup:
      description: Grupo econômico
      content: { application/json: { schema: { $ref: '#/components/schemas/EconomicGroup' } } }
    LegalEntity:
      description: Entidade jurídica
      content: { application/json: { schema: { $ref: '#/components/schemas/LegalEntity' } } }
    Unit:
      description: Unidade organizacional
      content: { application/json: { schema: { $ref: '#/components/schemas/Unit' } } }
    Tree:
      description: Nós da estrutura na data (lista plana com parentUnitId e depth)
      content: { application/json: { schema: { $ref: '#/components/schemas/Tree' } } }
    Establishment:
      description: Estabelecimento
      content: { application/json: { schema: { $ref: '#/components/schemas/Establishment' } } }
    Problem:
      description: Erro RFC 9457
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    BusinessCode: { type: string, pattern: '^[A-Z0-9][A-Z0-9._-]{0,39}$' }
    CountryCode: { type: string, pattern: '^[A-Z]{2}$' }
    CurrencyCode: { type: string, pattern: '^[A-Z]{3}$' }
    LegalEntityStatus: { enum: [PLANNED, ACTIVE, SUSPENDED, CLOSED] }
    PostalAddress:
      type: object
      required: [country, addressLines, locality]
      additionalProperties: false
      properties:
        country: { $ref: '#/components/schemas/CountryCode' }
        addressLines:
          {
            type: array,
            minItems: 1,
            maxItems: 4,
            items: { type: string, minLength: 1, maxLength: 200 },
          }
        locality: { type: string, minLength: 1, maxLength: 120 }
        administrativeArea: { type: [string, 'null'], maxLength: 120 }
        postalCode: { type: [string, 'null'], maxLength: 20 }
    CreateEconomicGroupRequest:
      type: object
      required: [code, name, referenceCurrency, referenceTimezone]
      additionalProperties: false
      properties:
        code: { $ref: '#/components/schemas/BusinessCode' }
        name: { type: string, minLength: 1, maxLength: 200 }
        referenceCurrency: { $ref: '#/components/schemas/CurrencyCode' }
        referenceTimezone: { type: string, examples: [America/Sao_Paulo] }
    UpdateEconomicGroupRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        referenceCurrency: { $ref: '#/components/schemas/CurrencyCode' }
        referenceTimezone: { type: string }
    EconomicGroup:
      type: object
      required:
        [
          id,
          code,
          name,
          referenceCurrency,
          referenceTimezone,
          status,
          createdAt,
          updatedAt,
          version,
        ]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        code: { $ref: '#/components/schemas/BusinessCode' }
        name: { type: string }
        referenceCurrency: { $ref: '#/components/schemas/CurrencyCode' }
        referenceTimezone: { type: string }
        status: { enum: [ACTIVE, CLOSED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 0 }
    EconomicGroupPage:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/EconomicGroup' } }
        nextCursor: { type: [string, 'null'] }
    TaxIdentifierRequest:
      type: object
      required: [scheme, value]
      additionalProperties: false
      properties:
        scheme: { type: string, examples: [BR_CNPJ, US_EIN] }
        value: { type: string, minLength: 1, maxLength: 40 }
        primary: { type: boolean, default: false }
        validFrom: { type: string, format: date }
    TaxIdentifier:
      type: object
      required: [id, scheme, value, primary, validFrom, validTo]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
