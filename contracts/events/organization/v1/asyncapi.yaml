asyncapi: 3.0.0
info:
  title: Eventos do Organization Management
  version: 1.0.0
  description: |
    Estrutura corporativa (grupos econômicos, entidades jurídicas, estabelecimentos e unidades organizacionais). Estado completo em `data`, com `version`:
    consumidores descartam versões já aplicadas e deduplicam por `id`. Entrega pelo menos uma vez (outbox),
    ordem garantida por agregado (chave = id do agregado). Ver docs/domains/organization/ORGANIZATION_EVENTS.md.
defaultContentType: application/cloudevents+json
channels:
  economicGroup:
    address: organization.economic-group.v1
    messages:
      economicGroupEvent:
        contentType: application/cloudevents+json
        payload:
          schemaFormat: application/schema+json;version=draft-2020-12
          schema: { $ref: './economic-group-event.schema.json' }
  legalEntity:
    address: organization.legal-entity.v1
    messages:
      legalEntityEvent:
        contentType: application/cloudevents+json
        payload:
          schemaFormat: application/schema+json;version=draft-2020-12
          schema: { $ref: './legal-entity-event.schema.json' }
  establishment:
    address: organization.establishment.v1
    messages:
      establishmentEvent:
        contentType: application/cloudevents+json
        payload:
          schemaFormat: application/schema+json;version=draft-2020-12
          schema: { $ref: './establishment-event.schema.json' }
  unit:
    address: organization.unit.v1
    messages:
      unitEvent:
        contentType: application/cloudevents+json
        payload:
          schemaFormat: application/schema+json;version=draft-2020-12
          schema: { $ref: './unit-event.schema.json' }
  reorganization:
    address: organization.reorganization.v1
    messages:
      reorganizationEvent:
        contentType: application/cloudevents+json
        payload:
          schemaFormat: application/schema+json;version=draft-2020-12
          schema: { $ref: './reorganization-event.schema.json' }
  costCenter:
    address: organization.cost-center.v1
    messages:
      costCenterEvent:
        contentType: application/cloudevents+json
        payload:
          schemaFormat: application/schema+json;version=draft-2020-12
          schema: { $ref: './cost-center-event.schema.json' }
  ownership:
    address: organization.ownership.v1
    messages:
      ownershipEvent:
        contentType: application/cloudevents+json
        payload:
          schemaFormat: application/schema+json;version=draft-2020-12
          schema: { $ref: './ownership-event.schema.json' }
operations:
  publishEconomicGroup:
    action: send
    channel: { $ref: '#/channels/economicGroup' }
  publishLegalEntity:
    action: send
    channel: { $ref: '#/channels/legalEntity' }
  publishEstablishment:
    action: send
    channel: { $ref: '#/channels/establishment' }
  publishUnit:
    action: send
    channel: { $ref: '#/channels/unit' }
  publishReorganization:
    action: send
    channel: { $ref: '#/channels/reorganization' }
  publishCostCenter:
    action: send
    channel: { $ref: '#/channels/costCenter' }
  publishOwnership:
    action: send
    channel: { $ref: '#/channels/ownership' }
