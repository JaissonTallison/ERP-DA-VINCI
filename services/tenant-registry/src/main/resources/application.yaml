# Configuração base. Credenciais e endereços de infraestrutura NÃO têm valor padrão: sem a variável, o serviço não sobe.
# Valores de desenvolvimento ficam em application-local.yaml (perfil `local`, ativado pelo bootRun e pelos testes).
server:
  port: ${PORT:5630}
  shutdown: graceful

spring:
  application:
    name: tenant-registry
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
          audiences: tenant-registry

tenant-registry:
  outbox:
    poll-interval: 500
    batch-size: 100
    send-timeout: 10s
    retention: 7d
    cleanup-cron: '0 15 3 * * *'
    topic-partitions: 6
    topic-replicas: ${KAFKA_TOPIC_REPLICAS:1}

management:
  endpoints:
    web:
      exposure:
        include: health, info, sbom
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:5610/v1/traces}
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:5610/v1/metrics}
