# Configuração base. Credenciais e endereços de infraestrutura NÃO têm valor padrão: sem a variável, o serviço não sobe.
# Valores de desenvolvimento ficam em application-local.yaml (perfil `local`, ativado pelo bootRun e pelos testes).
server:
  port: ${PORT:5631}
  shutdown: graceful

spring:
  application:
    name: identity
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: identity
      # Um grupo novo processa todo o histórico: a projeção é reconstruível a partir dos eventos.
      auto-offset-reset: earliest
    producer:
      acks: all
  security:
    oauth2:
      client:
        registration:
          keycloak-admin:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID:identity-service}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM:davinci}/protocol/openid-connect/token

identity:
  keycloak:
    base-url: ${KEYCLOAK_URL}
    realm: ${KEYCLOAK_REALM:davinci}
    client-registration-id: keycloak-admin
  consumer:
    retry-interval: 2s
    retry-attempts: 5
    dead-letter-partitions: 6
    dead-letter-replicas: ${KAFKA_TOPIC_REPLICAS:1}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:5610/v1/traces}
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:5610/v1/metrics}
