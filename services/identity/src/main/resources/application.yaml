# Padrões para o ambiente local (compose.yaml, portas 5600–5699). Em outros ambientes, sobrescreva por variável.
server:
  port: ${PORT:5631}
  shutdown: graceful

spring:
  application:
    name: identity
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5600/identity}
    username: ${DATABASE_USERNAME:identity}
    password: ${DATABASE_PASSWORD:identity_dev}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:5602}
    consumer:
      group-id: identity
      # Um grupo novo processa todo o histórico: a projeção é reconstruível a partir dos eventos.
      auto-offset-reset: earliest
    producer:
      acks: all
  security:
    oauth2:
      client:
        registration:
          keycloak-admin:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID:identity-service}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:identity_service_dev_secret}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_URL:http://localhost:5607}/realms/${KEYCLOAK_REALM:davinci}/protocol/openid-connect/token

identity:
  keycloak:
    base-url: ${KEYCLOAK_URL:http://localhost:5607}
    realm: ${KEYCLOAK_REALM:davinci}
    client-registration-id: keycloak-admin
  consumer:
    retry-interval: 2s
    retry-attempts: 5
    dead-letter-partitions: 6
    dead-letter-replicas: ${KAFKA_TOPIC_REPLICAS:1}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:5610/v1/traces}
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:5610/v1/metrics}
